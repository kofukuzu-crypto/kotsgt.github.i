<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOTSGT Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      font-family: "Courier New", monospace;
      color: #f1f1f1;
      background:
        linear-gradient(
          rgba(10, 10, 10, 0.72),
          rgba(10, 10, 10, 0.82)
        ),
        url("https://i.pinimg.com/1200x/ee/af/07/eeaf07550f8a7f451d77d33adce7d6a3.jpg")
        center / cover fixed no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.08),
          transparent 55%
        ),
        rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    .mouse-glow {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(220, 220, 220, 0.12) 28%,
        rgba(180, 180, 180, 0.05) 48%,
        transparent 72%
      );
      filter: blur(18px);
      opacity: 0;
      transition: opacity 0.25s ease;
      mix-blend-mode: screen;
    }

    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: #d8d8d8;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0) translateX(0);
        opacity: 0.2;
      }

      50% {
        transform: translateY(-30px) translateX(10px);
        opacity: 0.65;
      }
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 3px
      );
      opacity: 0.25;
    }

    .container {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .glitch-container {
      display: inline-block;
    }

    .glitch {
      color: #f5f5f5;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.7),
        0 0 20px rgba(210, 210, 210, 0.45);
    }

    .profile-section {
      margin-top: 40px;
      text-align: center;
    }

    .avatar-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      z-index: 2;
      border: 3px solid #d8d8d8;
      border-radius: 50%;
      background: rgba(20, 20, 20, 0.7);
      box-shadow:
        0 0 25px rgba(255, 255, 255, 0.25),
        0 0 60px rgba(190, 190, 190, 0.15);
      transition: 0.3s ease;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .avatar:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 35px rgba(255, 255, 255, 0.5),
        0 0 80px rgba(200, 200, 200, 0.25);
    }

    .line-decoration {
      position: relative;
      width: 100px;
      height: 1px;
      margin: 30px auto;
      background: linear-gradient(
        90deg,
        transparent,
        #d8d8d8,
        transparent
      );
    }

    .line-decoration::before,
    .line-decoration::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e5e5e5;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      transform: translateY(-50%);
    }

    .line-decoration::before {
      left: 0;
    }

    .line-decoration::after {
      right: 0;
    }

    .bio-text {
      max-width: 500px;
      margin: 20px auto;
      color: #d0d0d0;
      font-size: 16px;
      line-height: 1.8;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.5s;
    }

    .bio-text span {
      color: #e5e5e5;
      font-weight: bold;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .links-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.8s;
    }

    .link-btn {
      display: inline-block;
      position: relative;
      overflow: hidden;
      padding: 14px 32px;
      border: 2px solid #d8d8d8;
      color: #e5e5e5;
      background: rgba(10, 10, 10, 0.25);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
    }

    .link-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.22),
        transparent
      );
      transition: left 0.5s;
    }

    .link-btn:hover::before {
      left: 100%;
    }

    .link-btn:hover {
      color: #111;
      background: #e0e0e0;
      box-shadow:
        0 0 25px rgba(255, 255, 255, 0.4),
        0 0 50px rgba(200, 200, 200, 0.2);
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .glitch {
        font-size: 42px;
        letter-spacing: 4px;
      }

      .avatar-container {
        width: 160px;
        height: 160px;
      }

      .links-container {
        flex-direction: column;
        width: 100%;
        max-width: 250px;
      }

      .link-btn {
        width: 100%;
      }

      .mouse-glow {
        width: 220px;
        height: 220px;
      }
    }
  </style>
</head>

<body>
  <div class="mouse-glow"></div>
  <div class="scanlines"></div>
  <div class="particles" id="particles"></div>

  <main class="container">
    <div class="glitch-container">
      <h1 class="glitch">KOTSGT</h1>
    </div>

    <section class="profile-section">
      <div class="avatar-container">
        <div class="avatar">
          <img
            src="https://avatars.mds.yandex.net/i?id=d025d9b41279bf2ea0c4a2c395a0aedf_l-5219738-images-thumbs&n=13"
            alt="Аватар"
          />
        </div>
      </div>

      <div class="line-decoration"></div>

      <p class="bio-text">
        <span>✦</span> Full Stack Developer <span>✦</span>
      </p>

      <div class="links-container">
        <a
          href="https://github.com/kofukuzu-crypto"
          target="_blank"
          rel="noopener noreferrer"
          class="link-btn"
        >
          GitHub
        </a>

        <a
          href="https://t.me/kotsgt"
          target="_blank"
          rel="noopener noreferrer"
          class="link-btn"
        >
          Telegram
        </a>
      </div>
    </section>
  </main>

  <script>
    const mouseGlow = document.querySelector(".mouse-glow");

    document.addEventListener("mousemove", (event) => {
      mouseGlow.style.left = `${event.clientX}px`;
      mouseGlow.style.top = `${event.clientY}px`;
      mouseGlow.style.opacity = "1";
    });

    document.addEventListener("mouseleave", () => {
      mouseGlow.style.opacity = "0";
    });

    function createParticles() {
      const container = document.getElementById("particles");

      for (let i = 0; i < 35; i++) {
        const particle = document.createElement("div");

        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.width = Math.random() * 3 + 1 + "px";
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 4 + "s";
        particle.style.animationDuration = Math.random() * 4 + 4 + "s";

        container.appendChild(particle);
      }
    }

    createParticles();
  </script>
</body>
</html>
