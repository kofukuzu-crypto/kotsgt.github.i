<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      color: #fff;
      overflow-x: hidden;
      position: relative;
    }

    /* Sakura particles */
    .sakura-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .sakura {
      position: absolute;
      width: 12px;
      height: 12px;
      background: radial-gradient(ellipse at center, #ffb7c5 0%, #ff8fa3 50%, transparent 70%);
      border-radius: 50% 0 50% 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      filter: blur(0.5px);
    }

    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(110vh) rotate(720deg) translateX(100px);
        opacity: 0;
      }
    }

    /* Particle system */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      background: #ff6b9d;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-30px) translateX(10px);
        opacity: 0.8;
      }
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    /* Glitch effect */
    .glitch-container {
      position: relative;
      display: inline-block;
    }

    .glitch {
      font-size: 72px;
      font-weight: 900;
      text-transform: uppercase;
      position: relative;
      color: #fff;
      letter-spacing: 8px;
      text-shadow: 
        0 0 10px #ff6b9d,
        0 0 20px #ff6b9d,
        0 0 40px #ff6b9d;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .glitch::before {
      animation: glitch-1 2s infinite linear alternate-reverse;
      color: #00ffff;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
      text-shadow: -2px 0 #00ffff;
    }

    .glitch::after {
      animation: glitch-2 3s infinite linear alternate-reverse;
      color: #ff00ff;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
      text-shadow: 2px 0 #ff00ff;
    }

    @keyframes glitch-1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(-3px, -3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(3px, -3px); }
    }

    @keyframes glitch-2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(3px, -3px); }
      40% { transform: translate(3px, 3px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(-3px, 3px); }
    }

    /* Profile section */
    .profile-section {
      margin-top: 40px;
      text-align: center;
    }

    .avatar-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #1a1a1a;
      border: 3px solid #ff6b9d;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
      box-shadow: 0 0 30px rgba(255, 107, 157, 0.3);
      position: relative;
      z-index: 2;
    }

    /* Bio text with kinetic effect */
    .bio-text {
      font-size: 16px;
      color: #aaa;
      max-width: 500px;
      line-height: 1.8;
      margin: 20px auto;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.5s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bio-text span {
      color: #ff6b9d;
      font-weight: bold;
    }

    /* Stats */
    .stats-container {
      display: flex;
      gap: 50px;
      margin: 40px 0;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 0.8s;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 42px;
      font-weight: bold;
      color: #ff6b9d;
      text-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
      position: relative;
    }

    .stat-value::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff6b9d, transparent);
    }

    .stat-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    /* Links */
    .links-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      opacity: 0;
      animation: fadeInUp 1s ease forwards;
      animation-delay: 1s;
    }

    .link-btn {
      padding: 14px 32px;
      background: transparent;
      border: 2px solid #ff6b9d;
      color: #ff6b9d;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 107, 157, 0.3), transparent);
      transition: left 0.5s;
    }

    .link-btn:hover::before {
      left: 100%;
    }

    .link-btn:hover {
      background: #ff6b9d;
      color: #000;
      box-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
    }

    /* Decorative elements */
    .line-decoration {
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff6b9d, transparent);
      margin: 30px auto;
      position: relative;
    }

    .line-decoration::before,
    .line-decoration::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ff6b9d;
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      box-shadow: 0 0 10px #ff6b9d;
    }

    .line-decoration::before {
      left: 0;
    }

    .line-decoration::after {
      right: 0;
    }

    /* Scanlines effect */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
      );
      opacity: 0.3;
    }

    /* Typing cursor */
    .cursor {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: #ff6b9d;
      margin-left: 5px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>

<body>
  <!-- Scanlines overlay -->
  <div class="scanlines"></div>

  <!-- Sakura particles -->
  <div class="sakura-container" id="sakuraContainer"></div>

  <!-- Background particles -->
  <div class="particles" id="particles"></div>

  <!-- Main content -->
  <div class="container">
    <div class="glitch-container">
      <h1 class="glitch" data-text="KOTSGT">KOTSGT</h1>
    </div>

    <div class="profile-section">
      <div class="avatar-container">
        <div class="avatar">🌸</div>
      </div>

      <div class="line-decoration"></div>

      <p class="bio-text">
        <span>✦</span> Full Stack Developer <span>✦</span><br>
        Мне 12 лет на момент 2026 года и я создаю клиенты Minecraft<br>
        Вы можете посмотреть проекты ниже
      </p>

      <div class="links-container">
        <a href="https://github.com/kofukuzu-crypto" target="_blank" class="link-btn">GitHub</a>
        <a href="https://t.me/kotsgt" target="_blank" class="link-btn">Telegram</a>
      </div>
    </div>
  </div>

  <script>
    // Create sakura petals
    function createSakura() {
      const container = document.getElementById('sakuraContainer');
      const sakuraCount = 30;

      for (let i = 0; i < sakuraCount; i++) {
        const sakura = document.createElement('div');
        sakura.className = 'sakura';
        sakura.style.left = Math.random() * 100 + '%';
        sakura.style.animationDuration = (Math.random() * 10 + 8) + 's';
        sakura.style.animationDelay = Math.random() * 10 + 's';
        sakura.style.width = (Math.random() * 8 + 8) + 'px';
        sakura.style.height = (Math.random() * 8 + 8) + 'px';
        
        // Random colors for sakura
        const colors = [
          'radial-gradient(ellipse at center, #ffb7c5 0%, #ff8fa3 50%, transparent 70%)',
          'radial-gradient(ellipse at center, #ffc0cb 0%, #ffb6c1 50%, transparent 70%)',
          'radial-gradient(ellipse at center, #fff0f5 0%, #ffe4e9 50%, transparent 70%)'
        ];
        sakura.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        container.appendChild(sakura);
      }
    }

    // Create floating particles
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 50;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.width = (Math.random() * 4 + 2) + 'px';
        particle.style.height = particle.style.width;
        particle.style.animationDelay = Math.random() * 4 + 's';
        particle.style.animationDuration = (Math.random() * 4 + 4) + 's';
        
        // Random particle colors
        const colors = ['#ff6b9d', '#00ffff', '#ff00ff', '#ffb7c5', '#c44569'];
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        
        container.appendChild(particle);
      }
    }

    // Initialize
    createSakura();
    createParticles();

    // Glitch effect intensifier
    const glitchElement = document.querySelector('.glitch');
    
    setInterval(() => {
      glitchElement.style.textShadow = `
        ${Math.random() * 10 - 5}px ${Math.random() * 10 - 5}px 0 rgba(255, 0, 255, 0.7),
        ${Math.random() * 10 - 5}px ${Math.random() * 10 - 5}px 0 rgba(0, 255, 255, 0.7),
        0 0 10px #ff6b9d
      `;
    }, 100);

    // Button hover sound effect simulation (visual feedback)
    document.querySelectorAll('.link-btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        btn.style.transform = 'scale(1.05)';
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
</html>
